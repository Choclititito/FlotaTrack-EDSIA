name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  # Lint, tipos y pruebas unitarias contra SQLite en memoria (rápido).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # requirements-dev.txt NO incluye "-r requirements.txt", así que
      # hay que instalar ambos archivos por separado.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy app
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  # Integración real: migra y levanta la API contra Postgres de verdad.
  smoke-test:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: flotatrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleet -d flotatrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:

      DATABASE_URL: postgresql+psycopg2://fleet:secret@localhost:5432/flotatrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Migraciones
        run: alembic upgrade head
      - name: Levantar API
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &
      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
      - name: Smoke test - crear camión
        # Basado en el ejemplo del README: POST /trucks con plates,
        # model y capacity_kg, y confirmar que se puede consultar.
        run: |
          TRUCK_ID=$(curl -sf -X POST http://localhost:8000/trucks \
            -H "Content-Type: application/json" \
            -d '{"plates":"ABC-123","model":"Kenworth T680","capacity_kg":20000}' \
            | python -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "Camión creado: $TRUCK_ID"
          curl -sf "http://localhost:8000/trucks" | grep "ABC-123"

  # Requiere que exista un Dockerfile válido en la raíz (ya lo tienes).
  security-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker
        run: docker build -t flotatrack:ci .
      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "flotatrack:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  notify-on-failure:
    needs: [test, smoke-test, security-scan]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI falló en main - commit ${context.sha.substring(0, 7)}`,
              body: `El pipeline de CI falló en la rama main.\n\nCommit: ${context.sha}\nEjecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["ci-failure"]
            })

  deploy:
    needs: [test, smoke-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disparar despliegue
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
